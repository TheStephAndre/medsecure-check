{% extends "base.html" %} {% block content %}
<article>
  <header style="text-align: center">
    <h2 style="color: var(--ins-color)">✓ {{ SUCCESS.title }}</h2>
    <p>{{ SUCCESS.message }}</p>
  </header>

  <section style="text-align: center; padding: 2rem 0">
    <p>
      {{ SUCCESS.transaction_prefix }} <strong>{{ PRODUCT.name }}</strong> {{
      SUCCESS.transaction_suffix }}
    </p>

    <div style="margin-top: 2rem">
      <a
        href="/api/v1/report/{{ submission_id }}"
        role="button"
        class="primary"
      >
        {{ SUCCESS.download_button }}
      </a>
    </div>
  </section>

  <footer>
    <p style="text-align: center">
      <small>{{ SUCCESS.invoice_note }}</small>
    </p>
    <div style="text-align: center">
      <a href="/?lang={{ current_lang }}" class="secondary"
        >{{ SUCCESS.back_home }}</a
      >
    </div>
  </footer>
</article>
{% endblock %}
